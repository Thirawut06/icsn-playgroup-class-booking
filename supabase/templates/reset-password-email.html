<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 40px 20px;
    }

    .card {
      max-width: 450px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .logo {
      height: 48px;
      width: auto;
      margin-bottom: 24px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    h1 {
      color: #0f172a;
      font-size: 20px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 12px;
    }

    p {
      color: #475569;
      font-size: 15px;
      line-height: 1.5;
      margin-top: 0;
      margin-bottom: 24px;
    }

    .button {
      display: inline-block;
      background-color: #0f172a;
      color: #ffffff !important;
      text-decoration: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
    }

    .footer {
      margin-top: 24px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="https://playgroup.icsn.ac.th/main-logo-icsn.png" alt="ICSN Logo" class="logo" height="48">
    <h1>ตั้งรหัสผ่านใหม่ (Reset Password)</h1>
    <p>เราได้รับคำขอให้ตั้งรหัสผ่านใหม่สำหรับบัญชีของคุณบนระบบ <b>ICSN Panda Playgroup</b><br>กรุณากดปุ่มด้านล่างนี้เพื่อทำรายการต่อได้เลยค่ะ</p>

    <a href="{{ .SiteURL }}/th/auth/verify-reset?token_hash={{ .TokenHash }}" class="button">ตั้งรหัสผ่านใหม่</a>

    <div class="footer">
      หากคุณไม่ได้เป็นผู้ขอตั้งรหัสผ่านใหม่ สามารถเพิกเฉยต่ออีเมลฉบับนี้ได้เลยค่ะ
    </div>
  </div>
</body>

</html>
